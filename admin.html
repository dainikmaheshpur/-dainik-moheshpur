<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel | দৈনিক মহেশপুর</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#222;font-family:"Noto Sans Bengali",sans-serif}.top{background:#a91919;color:white;padding:16px max(16px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}.top h1{font-size:22px;margin:0}.top a{color:white}.wrap{max-width:1100px;margin:24px auto;padding:0 14px}.panel{background:white;border:1px solid #e1e1e1;border-radius:10px;padding:20px;margin-bottom:18px;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.field{display:block;margin:12px 0;font-size:14px;font-weight:600}.field input,.field textarea,.field select{display:block;width:100%;margin-top:6px;border:1px solid #ccc;border-radius:6px;padding:11px;font:inherit;background:white}.field textarea{min-height:130px;resize:vertical}.btn{border:0;border-radius:6px;padding:10px 15px;font:inherit;cursor:pointer;background:#a91919;color:white}.btn.secondary{background:#444}.btn.danger{background:#8b1c1c}.msg{padding:10px;border-radius:6px;background:#f5f5f5;margin:10px 0;font-size:14px}.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.item{padding:12px 0;border-bottom:1px solid #eee}.item strong{display:block}.item small{color:#666}.item button{margin-top:8px;margin-right:6px}.hint{font-size:12px;color:#666;font-weight:400}.image-preview{max-width:220px;max-height:140px;display:block;margin-top:8px;border-radius:6px}.itemlist{max-height:650px;overflow:auto}@media(max-width:800px){.grid{grid-template-columns:1fr}.top h1{font-size:18px}.panel{padding:14px}}
</style></head><body>
<header class="top"><h1>দৈনিক মহেশপুর — Admin Panel</h1><div class="row"><a href="/" target="_blank">ওয়েবসাইট দেখুন</a><button id="logout" class="btn secondary hidden">লগআউট</button></div></header>
<div class="wrap">
<section id="loginPanel" class="panel" style="max-width:480px;margin:35px auto"><h2>অ্যাডমিন লগইন</h2><p>সংবাদ তৈরি ও পরিচালনার জন্য লগইন করুন।</p><form id="loginForm"><label class="field">ইউজারনেম<input name="username" autocomplete="username" required></label><label class="field">পাসওয়ার্ড<input name="password" type="password" autocomplete="current-password" required></label><button class="btn">লগইন</button></form><div id="loginMsg" class="msg hidden"></div></section>
<section id="appPanel" class="hidden"><div id="msg" class="msg hidden"></div><div class="grid">
<div class="panel"><h2 id="formTitle">নতুন সংবাদ লিখুন</h2><form id="articleForm">
<input type="hidden" name="id"><input type="hidden" name="image">
<label class="field">সংবাদের শিরোনাম *<input name="title" maxlength="240" required></label>
<label class="field">সংবাদ বিভাগ / এলাকা *<select name="category" required><optgroup label="এলাকাভিত্তিক সংবাদ"><option value="মহেশপুর">সমগ্র মহেশপুর উপজেলা</option><option value="মহেশপুর পৌরসভা">মহেশপুর পৌরসভা</option><option value="এসবিকে">এসবিকে ইউনিয়ন</option><option value="ফতেপুর">ফতেপুর ইউনিয়ন</option><option value="পান্তাপাড়া">পান্তাপাড়া ইউনিয়ন</option><option value="স্বরুপপুর">স্বরুপপুর ইউনিয়ন</option><option value="শ্যামকুড়">শ্যামকুড় ইউনিয়ন</option><option value="নেপা">নেপা ইউনিয়ন</option><option value="কাজিরবেড়">কাজিরবেড় ইউনিয়ন</option><option value="বাঁশবাড়ীয়া">বাঁশবাড়ীয়া ইউনিয়ন</option><option value="যাদবপুর">যাদবপুর ইউনিয়ন</option><option value="নাটিমা">নাটিমা ইউনিয়ন</option><option value="মান্দারবাড়ীয়া">মান্দারবাড়ীয়া ইউনিয়ন</option><option value="আজমপুর">আজমপুর ইউনিয়ন</option></optgroup><optgroup label="স্থানীয় বিষয়ভিত্তিক সংবাদ"><option value="রাজনীতি">স্থানীয় রাজনীতি</option><option value="শিক্ষা">শিক্ষা</option><option value="কৃষি">কৃষি</option><option value="বিনোদন">বিনোদন</option><option value="স্বাস্থ্য">স্বাস্থ্য</option><option value="খেলাধুলা">খেলাধুলা</option><option value="সংস্কৃতি">সংস্কৃতি</option><option value="উন্নয়ন">উন্নয়ন</option><option value="দুর্ঘটনা">দুর্ঘটনা</option><option value="মানবিক">মানবিক সংবাদ</option></optgroup></select></label>
<label class="field">সংক্ষিপ্ত বিবরণ<label class="hint">সংবাদের সারাংশ (সর্বোচ্চ ৬০০ অক্ষর)</label><textarea name="summary" maxlength="600" style="min-height:80px"></textarea></label>
<label class="field">সংবাদের বিস্তারিত *<textarea name="body" required></textarea></label>
<label class="field">সংবাদদাতা / লেখক<input name="author" value="দৈনিক মহেশপুর ডেস্ক"></label>
<label class="field">সংবাদের ছবি <input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><span class="hint">JPG, PNG, WEBP বা GIF; সর্বোচ্চ ৫ MB।</span><img id="imagePreview" class="image-preview hidden" alt="ছবির প্রিভিউ"></label>
<label class="field">প্রকাশের অবস্থা<select name="status"><option value="published">প্রকাশ করুন</option><option value="draft">খসড়া হিসেবে রাখুন</option></select></label>
<div class="row"><button class="btn" type="submit">সংরক্ষণ করুন</button><button class="btn secondary" type="button" id="resetBtn">নতুন সংবাদ</button></div>
</form></div>
<div class="panel"><h2>প্রকাশিত / সংরক্ষিত সংবাদ</h2><div class="itemlist" id="articleList">লোড হচ্ছে…</div></div>
</div></section>
</div>
<script>
const $=s=>document.querySelector(s);let articles=[];
function showMsg(text,where='#msg'){const el=$(where);el.textContent=text;el.classList.remove('hidden');}
async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{...(opts.body instanceof FormData?{}:{'Content-Type':'application/json'}),...(opts.headers||{})}});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||'অনুরোধ সম্পন্ন হয়নি।');return data}
async function checkLogin(){const d=await api('/api/admin/me');$('#loginPanel').classList.toggle('hidden',d.loggedIn);$('#appPanel').classList.toggle('hidden',!d.loggedIn);$('#logout').classList.toggle('hidden',!d.loggedIn);if(d.loggedIn)loadArticles()}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const f=new FormData(e.target);await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password')})});$('#loginMsg').classList.add('hidden');e.target.reset();checkLogin()}catch(err){showMsg(err.message,'#loginMsg')}});
$('#logout').addEventListener('click',async()=>{try{await api('/api/admin/logout',{method:'POST',body:'{}'});checkLogin()}catch(e){showMsg(e.message)}});
$('#imageFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;const preview=$('#imagePreview');preview.src=URL.createObjectURL(file);preview.classList.remove('hidden');try{const fd=new FormData();fd.append('image',file);const d=await api('/api/admin/upload',{method:'POST',body:fd});$('#articleForm').elements.image.value=d.image;showMsg('ছবি আপলোড হয়েছে।')}catch(err){showMsg(err.message)}});
$('#articleForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);const data=Object.fromEntries(f.entries());const id=data.id;delete data.id;try{if(id)await api('/api/admin/articles/'+id,{method:'PUT',body:JSON.stringify(data)});else await api('/api/admin/articles',{method:'POST',body:JSON.stringify(data)});showMsg(id?'সংবাদ আপডেট হয়েছে।':'সংবাদ সংরক্ষণ হয়েছে।');resetForm();loadArticles()}catch(err){showMsg(err.message)}});
function resetForm(){$('#articleForm').reset();$('#articleForm').elements.id.value='';$('#articleForm').elements.image.value='';$('#articleForm').elements.author.value='দৈনিক মহেশপুর ডেস্ক';$('#formTitle').textContent='নতুন সংবাদ লিখুন';$('#imagePreview').classList.add('hidden');$('#imageFile').value=''}
$('#resetBtn').addEventListener('click',resetForm);
async function loadArticles(){try{articles=await api('/api/admin/articles');$('#articleList').innerHTML=articles.map(a=>`<div class="item"><strong>${esc(a.title)}</strong><small>${esc(a.category)} · ${a.status==='published'?'প্রকাশিত':'খসড়া'} · ${new Date(a.updated_at).toLocaleDateString('bn-BD')}</small><div><button class="btn secondary" data-edit="${a.id}">সম্পাদনা</button><button class="btn danger" data-delete="${a.id}">মুছুন</button>${a.status==='published'?` <a href="/?article=${encodeURIComponent(a.slug)}" target="_blank">দেখুন</a>`:''}</div></div>`).join('')||'<p>এখনও কোনো সংবাদ নেই।</p>'}catch(err){showMsg(err.message)}}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('#articleList').addEventListener('click',async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.delete;if(edit){const a=articles.find(x=>x.id==edit);if(!a)return;const f=$('#articleForm');for(const k of ['id','title','category','summary','body','image','author','status'])f.elements[k].value=a[k]||'';$('#formTitle').textContent='সংবাদ সম্পাদনা করুন';if(a.image){$('#imagePreview').src=a.image;$('#imagePreview').classList.remove('hidden')}window.scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('এই সংবাদটি স্থায়ীভাবে মুছে ফেলবেন?')){try{await api('/api/admin/articles/'+del,{method:'DELETE'});showMsg('সংবাদ মুছে ফেলা হয়েছে।');loadArticles()}catch(err){showMsg(err.message)}}});
checkLogin().catch(()=>showMsg('সার্ভার চালু আছে কি না যাচাই করুন।','#loginMsg'));
</script></body></html>
